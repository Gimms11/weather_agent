<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="45%" stop-color="#0c1427" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glow Gradients -->
    <radialGradient id="glowCyan" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#fb8500" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fb8500" stop-opacity="0" />
    </radialGradient>

    <!-- UI Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f77f00" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="480" rx="16" fill="url(#bgGrad)" />

  <!-- Background Ambient Glows -->
  <circle cx="350" cy="200" r="320" fill="url(#glowCyan)" />
  <circle cx="950" cy="260" r="380" fill="url(#glowPurple)" />

  <!-- Isobar / Atmospheric Contour Waves -->
  <g opacity="0.16" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M-100,120 Q200,60 500,140 T1100,80 T1300,140" />
    <path d="M-100,200 Q250,140 550,220 T1150,160 T1300,210" />
    <path d="M-100,280 Q300,220 600,300 T1200,240 T1300,290" />
    <path d="M-100,360 Q350,300 650,380 T1250,320 T1300,370" />
  </g>

  <!-- High-tech Grid Background Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="560" y1="0" x2="560" y2="480" />
    <line x1="720" y1="0" x2="720" y2="480" />
    <line x1="880" y1="0" x2="880" y2="480" />
    <line x1="1040" y1="0" x2="1040" y2="480" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
  </g>

  <!-- Left Column: Branding, Title, Subtitle, Pills -->
  <g transform="translate(80, 0)">
    <!-- Top System Badge -->
    <g transform="translate(0, 75)">
      <rect width="210" height="30" rx="15" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="15" r="4.5" fill="#38bdf8" />
      <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#bae6fd" letter-spacing="0.8">AUTONOMOUS AGENT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">Weather Agent</text>

    <!-- Description -->
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Intelligent Conversational Meteorological Assistant
    </text>
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b">
      Powered by LangGraph ReAct Agent, Memory Checkpointing &amp; Google Weather API
    </text>

    <!-- Feature Tags / Tech Stack Chips -->
    <g transform="translate(0, 285)">
      <!-- Tag 1: LangGraph -->
      <g transform="translate(0, 0)">
        <rect width="130" height="36" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="18" y="23" font-family="monospace" font-size="13" font-weight="600" fill="#38bdf8">⚡ LangGraph</text>
      </g>
      <!-- Tag 2: LangChain -->
      <g transform="translate(142, 0)">
        <rect width="130" height="36" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="18" y="23" font-family="monospace" font-size="13" font-weight="600" fill="#818cf8">🦜 LangChain</text>
      </g>
      <!-- Tag 3: Model LLM -->
      <g transform="translate(284, 0)">
        <rect width="130" height="36" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="18" y="23" font-family="monospace" font-size="13" font-weight="600" fill="#c084fc">🤖 Model LLM</text>
      </g>
      <!-- Tag 4: Google Cloud -->
      <g transform="translate(426, 0)">
        <rect width="150" height="36" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="16" y="23" font-family="monospace" font-size="13" font-weight="600" fill="#34d399">☁️ Google Cloud</text>
      </g>
    </g>

    <!-- Micro Metadata Footer -->
    <g transform="translate(0, 360)">
      <line x1="0" y1="0" x2="570" y2="0" stroke="#1e293b" stroke-width="1" />
      <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">
        Architecture: <tspan fill="#cbd5e1">Stateful Checkpointer</tspan> • Protocol: <tspan fill="#cbd5e1">Tool Calling</tspan> • Provider: <tspan fill="#cbd5e1">GCP Weather API</tspan>
      </text>
    </g>
  </g>

  <!-- Right Column: Visual Weather Agent Hologram & Data Cards -->
  <g transform="translate(770, 70)">
    <!-- Main Glassmorphism Dashboard Container -->
    <rect width="360" height="330" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Inner Accent Top Bar -->
    <rect x="0" y="0" width="360" height="42" rx="20" fill="#1e293b" fill-opacity="0.6" />
    <!-- Window controls -->
    <circle cx="22" cy="21" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="38" cy="21" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="54" cy="21" r="5" fill="#10b981" opacity="0.8" />
    <text x="75" y="25" font-family="monospace" font-size="11" fill="#64748b">agent.session.weather</text>
    <rect x="270" y="12" width="70" height="18" rx="9" fill="#065f46" fill-opacity="0.5" stroke="#10b981" stroke-width="0.8" />
    <text x="284" y="24" font-family="monospace" font-size="9" font-weight="700" fill="#34d399">ONLINE</text>

    <!-- Weather Illustration: Radiant Sun + Beautiful SVG Cloud -->
    <g transform="translate(30, 65)">
      <!-- Sun Glow & Rays -->
      <circle cx="85" cy="50" r="50" fill="url(#glowSun)" />
      <circle cx="85" cy="50" r="30" fill="url(#sunGrad)" />

      <!-- Fluffy Cloud Layer -->
      <g>
        <ellipse cx="90" cy="92" rx="42" ry="26" fill="#e2e8f0" />
        <circle cx="70" cy="80" r="25" fill="#f1f5f9" />
        <circle cx="108" cy="70" r="30" fill="#ffffff" />
        <ellipse cx="125" cy="90" rx="30" ry="22" fill="#f8fafc" />
        <rect x="55" y="80" width="85" height="28" rx="14" fill="#f8fafc" />
      </g>

      <!-- Neon Rain Droplets / Data Stream -->
      <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round">
        <line x1="72" y1="124" x2="66" y2="140" opacity="0.85" />
        <line x1="97" y1="124" x2="91" y2="140" opacity="0.95" />
        <line x1="122" y1="124" x2="116" y2="140" opacity="0.85" />
      </g>

      <!-- Temperature Reading -->
      <text x="185" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#f8fafc">24°C</text>
      <text x="187" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="0.5">PRECIPITATION 12%</text>
      <text x="187" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">WIND: 14 km/h ENE</text>
    </g>

    <!-- Mini Telemetry / LangGraph Tool Call Box -->
    <g transform="translate(25, 230)">
      <rect width="310" height="74" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" font-family="monospace" font-size="11" fill="#38bdf8">> get_weather(city="Buenos Aires")</text>
      <text x="14" y="44" font-family="monospace" font-size="10" fill="#a7f3d0">✓ 200 OK | Forecast received (GCP)</text>
      <text x="14" y="62" font-family="monospace" font-size="10" fill="#64748b">→ Synthesizing natural response...</text>
      <circle cx="290" cy="50" r="4" fill="#38bdf8" />
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="479" rx="16" fill="none" stroke="#1e293b" stroke-width="1" />
</svg>
